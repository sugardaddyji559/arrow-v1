name: UI checks
on:
  push:
    branches: ['arena/3301d7d1-arrow-v1']
  workflow_dispatch:
permissions:
  contents: write
  checks: write
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Configure local example ad IDs
        run: cp lib/core/ad_secrets_example.dart lib/core/ad_secrets.dart
      - name: Resolve packages
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pubget.txt
      - name: Analyze
        shell: bash
        run: |
          flutter analyze --no-pub > analysis.txt 2>&1 || true
          cat analysis.txt
      - name: UI and interaction tests
        shell: bash
        run: |
          set -o pipefail
          flutter test test/widget_test.dart --reporter expanded 2>&1 | tee tests.txt
      - name: Render UI snapshots
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test test/ui_screenshots_test.dart --update-goldens --reporter expanded 2>&1 | tee snapshots.txt
      - name: Stage snapshots for review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for image in test/goldens/*.png; do
            [ -f "$image" ] || continue
            name=$(basename "$image" .png)
            printf '{"content":"%s","encoding":"base64"}' "$(base64 -w0 "$image")" > /tmp/image-blob.json
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/image-blob.json --jq .sha)
            echo "GOLDEN_${name}=$sha" >> "$GITHUB_ENV"
          done
      - name: Build web preview
        shell: bash
        run: |
          set -o pipefail
          flutter build web --release --no-pub 2>&1 | tee build.txt
      - name: Stage preview for Arena
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf /tmp/web-preview.tar.gz -C build web
          python3 - <<'PY'
          import base64,json
          data=base64.b64encode(open('/tmp/web-preview.tar.gz','rb').read()).decode()
          json.dump({'content':data,'encoding':'base64'},open('/tmp/preview-blob.json','w'))
          PY
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/preview-blob.json --jq .sha)
          echo "PREVIEW_BLOB=$sha" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: arrows-web-preview
          path: build/web
          retention-days: 3
      - name: Publish readable diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          parts=[]
          for name in ['pubget.txt','analysis.txt','tests.txt','snapshots.txt','build.txt']:
           p=pathlib.Path(name)
           if p.exists():
            content=p.read_text(errors='replace')
            if name=='analysis.txt':
             content='\n'.join(line for line in content.splitlines() if 'error •' in line or 'warning •' in line or 'issues found' in line)
            parts.append('## '+name+'\n```\n'+content[-18000:]+'\n```\n')
          parts.append('PREVIEW_BLOB='+os.environ.get('PREVIEW_BLOB','not-built'))
          parts.extend(k+'='+v for k,v in os.environ.items() if k.startswith('GOLDEN_'))
          text='\n'.join(parts)[:65000]
          json.dump({'name':'Flutter diagnostics','head_sha':os.environ['GITHUB_SHA'],'status':'completed','conclusion':'neutral','output':{'title':'UI verification output','summary':'Flutter analysis, tests, build logs, and preview blob.','text':text}},open('/tmp/check.json','w'))
          PY
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --input /tmp/check.json --jq .id